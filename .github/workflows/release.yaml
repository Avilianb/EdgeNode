name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v1.4.1-community-http3.1

permissions:
  contents: write

env:
  DEPENDENCY_OWNER: Avilianb
  DEPENDENCY_BRANCH: feature/community-http3

jobs:
  release:
    name: Build and release linux/amd64
    runs-on: ubuntu-24.04

    steps:
      - name: Check out EdgeNode
        uses: actions/checkout@v4
        with:
          path: EdgeNode

      - name: Check out EdgeCommon dependency
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DEPENDENCY_OWNER }}/EdgeCommon
          ref: ${{ env.DEPENDENCY_BRANCH }}
          path: EdgeCommon

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
          cache-dependency-path: |
            EdgeNode/go.sum
            EdgeCommon/go.sum

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Download modules
        working-directory: EdgeNode
        run: go mod download

      - name: Run HTTP/3 tests
        working-directory: EdgeNode
        run: go test -tags=community ./internal/nodes -run 'Test(HTTPRequestProcessHTTP3Headers|ListenerManager.*HTTP3|DecodeNodeHTTP3Policies)' -count=1

      - name: Package edge-node
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          dist="$RUNNER_TEMP/edge-node"
          asset="$RUNNER_TEMP/edge-node-linux-amd64-community-${RELEASE_TAG}.zip"
          rm -rf "$dist"
          mkdir -p "$dist/bin" "$dist/configs" "$dist/logs" "$dist/data"
          cp EdgeNode/build/configs/api_node.template.yaml "$dist/configs/"
          cp EdgeNode/build/configs/cluster.template.yaml "$dist/configs/"
          cp -R EdgeNode/build/www "$dist/"
          cp -R EdgeNode/build/pages "$dist/"
          (
            cd EdgeNode
            CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -trimpath -tags community -ldflags="-s -w" -o "$dist/bin/edge-node" ./cmd/edge-node
          )
          cd "$RUNNER_TEMP"
          zip -r -X -q "$asset" edge-node/
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG_NAME" "$ASSET" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG_NAME" \
            --notes "Community HTTP/3 edge-node release built by GitHub Actions for linux/amd64."
